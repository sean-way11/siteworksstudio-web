name: Sync SiteWorksStudio static files

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/bootstrap_site.py"
      - ".github/workflows/bootstrap-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Import public SiteWorksStudio pages
        run: python3 .github/scripts/bootstrap_site.py
      - name: Commit safe static snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html services.html portfolio.html order.html \
                  404.html robots.txt sitemap.xml .nojekyll README.md \
                  favicon.ico assets/
          if ! git diff --cached --quiet; then
            git commit -m "Update public static SiteWorksStudio website"
            git push origin HEAD:main
          fi
